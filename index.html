<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fretboard — Chord Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0c0a;
    --surface: #1a1712;
    --surface2: #231f1a;
    --border: #3a3228;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --amber: #d97706;
    --cream: #f5eedc;
    --muted: #8a7e6e;
    --mute: #8a3a2a;
    --drawer-height: 52px; /* collapsed handle height */
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    overflow: hidden; /* no body scroll — inner areas scroll */
  }

  /* Grain texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* ═══════════════════════════════════
     TOP HEADER
  ═══════════════════════════════════ */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .logo span { color: var(--cream); font-weight: 400; font-style: italic; }

  .mode-tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
  }
  .mode-tab {
    padding: 0.55rem 1rem;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .mode-tab + .mode-tab { border-left: 1px solid var(--border); }
  .mode-tab.active { background: var(--gold); color: var(--bg); }

  /* ═══════════════════════════════════
     MAIN SCROLLABLE CONTENT AREA
     sits between fixed header and fixed drawer
  ═══════════════════════════════════ */
  #app-main {
    position: fixed;
    top: 56px; /* header height */
    left: 0; right: 0;
    bottom: var(--drawer-height);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 1.5rem 1.25rem 1rem;
    transition: bottom 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  /* ═══════════════════════════════════
     INVERSIONS VIEW
  ═══════════════════════════════════ */
  .inversion-view { display: block; }
  .inversion-view.hidden { display: none; }

  /* Inversions controls — horizontal strip at top */
  .inv-controls {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .inv-controls-row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .control-label {
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    white-space: nowrap;
  }

  select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.55rem 0.75rem;
    cursor: pointer;
    appearance: none;
    outline: none;
    min-width: 80px;
  }
  select:focus { border-color: var(--gold); }

  .pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .pill {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    white-space: nowrap;
  }
  .pill:hover { border-color: var(--gold); color: var(--gold); }
  .pill.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }

  .chord-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 900;
    color: var(--cream);
    line-height: 1;
    margin-bottom: 0.3rem;
  }
  .chord-subtitle {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .chord-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
  }

  .chord-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .chord-card::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--gold);
    transform: scaleX(0);
    transition: transform 0.25s;
  }
  .chord-card:active { border-color: var(--gold); }
  .chord-card.selected {
    border-color: var(--gold);
    background: rgba(201,168,76,0.06);
    box-shadow: 0 3px 0 0 var(--gold);
  }
  .chord-card.selected::before { transform: scaleX(1); }

  .card-label {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold-light);
    margin-bottom: 0.2rem;
  }
  .card-type {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .fretboard-wrap { margin-top: 0.4rem; }
  .fret-position {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.25rem;
    letter-spacing: 0.05em;
  }
  svg.diagram { display: block; }

  /* Detail panel */
  .detail-panel {
    margin-top: 1.5rem;
    border: 1px solid var(--gold);
    border-top: 3px solid var(--gold);
    padding: 1.25rem 1.25rem 1.25rem;
    background: rgba(201,168,76,0.04);
    animation: fadeIn 0.3s ease;
    position: relative;
  }
  /* Arrow pointing up toward the selected card */
  .detail-panel::before {
    content: '';
    position: absolute;
    top: -9px;
    left: 1.5rem;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 8px solid var(--gold);
  }
  .detail-panel-eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .detail-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.75rem;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }
  .detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    margin: 0.75rem 0 1.25rem;
  }
  .meta-item { display: flex; flex-direction: column; gap: 0.15rem; }
  .meta-label {
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meta-value {
    font-family: 'Crimson Pro', serif;
    font-size: 1.15rem;
    color: var(--cream);
  }
  .tips-box {
    background: var(--surface);
    border-left: 3px solid var(--gold);
    padding: 1rem 1.1rem;
    font-family: 'Crimson Pro', serif;
    font-size: 1.1rem;
    color: var(--cream);
    line-height: 1.7;
  }
  .tips-box strong { color: var(--gold-light); font-weight: 600; }

  /* ═══════════════════════════════════
     PROGRESSIONS VIEW
  ═══════════════════════════════════ */
  .progression-view { display: none; }
  .progression-view.visible { display: block; }

  .prog-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--cream);
    line-height: 1.1;
    margin-bottom: 0.3rem;
  }
  .prog-desc {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .prog-sequence {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  .prog-chord-card {
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.65rem 0.9rem;
    min-width: 64px;
  }
  .prog-chord-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold-light);
  }
  .prog-degree {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }
  .prog-arrow { color: var(--muted); font-size: 1.1rem; }

  .tips-box.prog-tip { max-width: 100%; margin-bottom: 1.25rem; font-size: 1.05rem; }

  /* Position toggle */
  .pos-toggle-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .pos-toggle-label {
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .pos-btn {
    padding: 0.5rem 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pos-btn.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }

  .prog-diag-section-label {
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
  }
  .prog-detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
  }

  /* Category tags */
  .prog-item .prog-tag {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.15rem 0.4rem;
    border: 1px solid;
    margin-top: 0.35rem;
    display: inline-block;
  }
  .tag-dark  { color: #9b6f8a; border-color: #9b6f8a; }
  .tag-folk  { color: #7a9b6f; border-color: #7a9b6f; }
  .tag-modal { color: #6f8a9b; border-color: #6f8a9b; }
  .tag-classic { color: var(--muted); border-color: var(--border); }
  .tag-ab    { color: #9b8a6f; border-color: #9b8a6f; }

  /* ═══════════════════════════════════
     BOTTOM SHEET DRAWER
  ═══════════════════════════════════ */
  #drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    /* collapsed: only handle visible */
    transform: translateY(calc(100% - var(--drawer-height)));
    max-height: 80vh;
  }
  #drawer.open {
    transform: translateY(0);
  }

  /* Scrim behind open drawer */
  #drawer-scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 190;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #drawer-scrim.visible { opacity: 1; pointer-events: all; }

  /* Handle bar — always visible */
  #drawer-handle {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0.6rem 1.25rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-shrink: 0;
    height: var(--drawer-height);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #drawer-handle::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0.45rem;
    transform: translateX(-50%);
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
  }

  .drawer-handle-left {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    overflow: hidden;
  }
  .drawer-current-prog {
    font-size: 0.88rem;
    color: var(--gold-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  .drawer-hint {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .drawer-chevron {
    color: var(--gold);
    font-size: 1.1rem;
    transition: transform 0.3s;
    flex-shrink: 0;
  }
  #drawer.open .drawer-chevron { transform: rotate(180deg); }

  /* Drawer body — scrollable list */
  #drawer-body {
    background: var(--surface);
    border-top: 1px solid var(--border);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
    padding: 1rem 1.1rem 1.5rem;
    /* Only shown for progressions mode */
  }

  /* Drawer hidden in inversions mode */
  #drawer.inv-mode {
    transform: translateY(100%);
  }

  /* Key selector inside drawer */
  .drawer-section-label {
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.6rem;
  }

  .key-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0.35rem;
    margin-bottom: 1.25rem;
  }
  .key-btn {
    padding: 0.5rem 0;
    text-align: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .key-btn.active { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 500; }

  /* Category filter chips */
  .cat-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-bottom: 1rem;
  }
  .cat-pill {
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
  }
  .cat-pill:hover { border-color: var(--gold); color: var(--gold); }
  .cat-pill.active { background: rgba(201,168,76,0.15); border-color: var(--gold); color: var(--gold-light); }

  /* Progression list in drawer */
  .progression-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .prog-item {
    padding: 0.8rem 0.9rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .prog-item:active { border-color: var(--gold); }
  .prog-item.active { border-color: var(--gold); background: rgba(201,168,76,0.08); }
  .prog-name {
    font-size: 0.95rem;
    color: var(--gold-light);
    margin-bottom: 0.2rem;
  }
  .prog-chords {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Crimson Pro', serif;
  }

  /* Inversions drawer content */
  #inv-drawer-body {
    padding: 1rem 1.1rem 1.5rem;
  }
  .inv-drawer-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    margin-bottom: 1rem;
  }
  .pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  /* Desktop: revert to side-by-side layout */
  @media (min-width: 768px) {
    body { overflow: auto; }

    header {
      padding: 1.5rem 2.5rem;
      position: relative;
    }
    .logo { font-size: 2rem; }
    .mode-tab { font-size: 0.8rem; padding: 0.55rem 1.1rem; }

    #app-main {
      position: static;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 80px);
      padding: 0;
      overflow: visible;
      bottom: auto;
      top: auto;
      transition: none;
    }

    /* On desktop, hide the drawer and show classic sidebar */
    #drawer { display: none; }
    #drawer-scrim { display: none; }
    #desktop-sidebar {
      display: block;
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      background: var(--surface);
    }
    #desktop-main-content {
      padding: 2.5rem 3rem;
      overflow-y: auto;
    }

    .chord-title { font-size: 3rem; }
    .prog-title  { font-size: 2.5rem; }
    .chord-grid  { grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); }
    .prog-detail-grid { grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); }
  }

  @media (max-width: 767px) {
    #desktop-sidebar { display: none; }
    #desktop-main-content { display: contents; }
  }

</style>
</head>
<body>

<!-- ── FIXED HEADER ── -->
<header>
  <div class="logo">Fret<span>board</span></div>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('inversions')">Inversions</button>
    <button class="mode-tab" onclick="setMode('progressions')">Progressions</button>
  </div>
</header>

<!-- ── SCRIM ── -->
<div id="drawer-scrim" onclick="closeDrawer()"></div>

<!-- ── MAIN CONTENT ── -->
<div id="app-main">

  <!-- DESKTOP SIDEBAR (hidden on mobile via CSS) -->
  <div id="desktop-sidebar">
    <div id="desktop-inv-sidebar">
      <div style="margin-bottom:1.5rem;">
        <div class="drawer-section-label">Root Note</div>
        <select id="rootSelectDesktop" onchange="syncRoot(this.value)">
          <option>C</option><option>C#</option><option>D</option><option>D#</option>
          <option>E</option><option>F</option><option>F#</option><option>G</option>
          <option>G#</option><option>A</option><option>A#</option><option>B</option>
        </select>
      </div>
      <div>
        <div class="drawer-section-label">Chord Quality</div>
        <div class="pill-group" id="desktopQualityPills">
          <button class="pill active" onclick="setQuality(this,'major')">Major</button>
          <button class="pill" onclick="setQuality(this,'minor')">Minor</button>
          <button class="pill" onclick="setQuality(this,'dom7')">Dom 7</button>
          <button class="pill" onclick="setQuality(this,'maj7')">Maj 7</button>
          <button class="pill" onclick="setQuality(this,'min7')">Min 7</button>
          <button class="pill" onclick="setQuality(this,'dim')">Dim</button>
          <button class="pill" onclick="setQuality(this,'aug')">Aug</button>
          <button class="pill" onclick="setQuality(this,'sus2')">Sus2</button>
          <button class="pill" onclick="setQuality(this,'sus4')">Sus4</button>
          <button class="pill" onclick="setQuality(this,'add9')">Add9</button>
        </div>
      </div>
    </div>
    <div id="desktop-prog-sidebar" style="display:none">
      <div style="margin-bottom:1.25rem;">
        <div class="drawer-section-label">Key</div>
        <select id="progKeySelectDesktop" onchange="syncProgKey(this.value)">
          <option>C</option><option>C#</option><option>D</option><option>D#</option>
          <option>E</option><option>F</option><option>F#</option><option>G</option>
          <option>G#</option><option>A</option><option>A#</option><option>B</option>
        </select>
      </div>
      <div style="margin-bottom:1rem;">
        <div class="drawer-section-label">Filter</div>
        <div class="cat-filter" id="desktopCatFilter">
          <button class="cat-pill active" onclick="setCategory(this,'all')">All</button>
          <button class="cat-pill" onclick="setCategory(this,'dark')">Dark</button>
          <button class="cat-pill" onclick="setCategory(this,'modal')">Modal</button>
          <button class="cat-pill" onclick="setCategory(this,'folk')">Folk</button>
          <button class="cat-pill" onclick="setCategory(this,'ab')">A/B</button>
          <button class="cat-pill" onclick="setCategory(this,'classic')">Classic</button>
        </div>
      </div>
      <div>
        <div class="drawer-section-label">Progressions</div>
        <div class="progression-list" id="progListDesktop"></div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div id="desktop-main-content">

    <!-- ── INVERSIONS VIEW ── -->
    <div class="inversion-view" id="inversionView">

      <!-- Mobile controls strip -->
      <div class="inv-controls" id="mobileInvControls">
        <div class="inv-controls-row">
          <span class="control-label">Root</span>
          <select id="rootSelectMobile" onchange="syncRoot(this.value)">

// Chord intervals

  major:  { name:'Major',   sym:'',    intervals:[0,4,7] },
  minor:  { name:'Minor',   sym:'m',   intervals:[0,3,7] },
  dom7:   { name:'Dom 7',   sym:'7',   intervals:[0,4,7,10] },
  maj7:   { name:'Maj 7',   sym:'maj7',intervals:[0,4,7,11] },
  min7:   { name:'Min 7',   sym:'m7',  intervals:[0,3,7,10] },
  dim:    { name:'Dim',     sym:'°',   intervals:[0,3,6] },
  aug:    { name:'Aug',     sym:'+',   intervals:[0,4,8] },

  sus4:   { name:'Sus4',    sym:'sus4',intervals:[0,5,7] },

// ─── TRANSPOSABLE SHAPE ENGINE ─────────────────────────────────────────────
// Each shape is defined relative to a "base fret" offset from the root note's
// position on a specific string. We store the open-position template and
// compute actual fret numbers at runtime for any root.
//
// String tuning in semitones from C: E2=4, A2=9, D3=2, G3=7, B3=11, e4=4
// String indices: 0=low E, 1=A, 2=D, 3=G, 4=B, 5=high e
const STRING_TUNING = [4, 9, 2, 7, 11, 4]; // semitones from C, per string

// For a given root note and string, find the lowest fret >= minFret that plays that note
function fretForNote(noteIdx, stringIdx, minFret = 0) {
  const open = STRING_TUNING[stringIdx]; // pitch of open string (mod 12)
  let fret = ((noteIdx - open) % 12 + 12) % 12;
  while (fret < minFret) fret += 12;
  return fret;
}

// Shape templates: offsets relative to root fret on a given anchor string.
// null = muted. Each shape specifies which string carries the root.
// offsets: array of [relFret|null] per string [E,A,D,G,B,e]
// anchorString: which string index the root sits on
// minFret: minimum fret to place (so open shapes stay near nut)

// Compute actual voicings from a shape template for a given root note
function computeVoicing(shape, rootNote) {
  const rootIdx = NOTES.indexOf(rootNote);
  const anchorStr = shape.anchor;
  // Find root fret on anchor string
  const minFret = shape.minFret || 0;
  const rootFret = fretForNote(rootIdx, anchorStr, minFret);
  
  // Compute each string's fret
  const voicing = shape.offsets.map((offset, strIdx) => {
    if (offset === null) return null;
    const fret = rootFret + offset;
    // If fret 0 is specifically wanted (open string) check it matches
    // For non-anchor open strings in templates, keep as-is offset from root
    return fret;
  });

  // baseFret: the lowest non-zero fret played, for diagram positioning
  const frettedFrets = voicing.filter(f => f !== null && f > 0);
  const minPlayed = frettedFrets.length ? Math.min(...frettedFrets) : 1;
  const baseFret = minPlayed <= 1 ? 1 : minPlayed;

  // Build fingering string
  const fingerStr = voicing.map(f => f === null ? 'x' : f === 0 ? '0' : f).join('-');

  return {
    label: shape.label,
    voicing,
    baseFret,
    fingers: fingerStr,
    tips: shape.tips,
  };
}

// Get all voicings for a root + quality
function getVoicings(rootNote, quality) {
  const shapes = SHAPE_TEMPLATES[quality] || SHAPE_TEMPLATES['major'];
  return shapes.map(shape => computeVoicing(shape, rootNote));
}

// Get voicings for a given root + quality.
// Open overrides exist for specific common chords (Am, Em, Dm, G, C, etc.) and
// cover baseFret 1-3. For all other roots we must NOT filter computed low-fret shapes —
// e.g. A#major's A-shape lives at fret 1, Fm's Em-shape at fret 1.
// Rule: only suppress computed shapes whose baseFret falls within the range already
// covered by open overrides for THAT SPECIFIC chord. If no override exists, keep everything.
function getVoicingsForChord(root, quality) {
  const key = `${root}-${quality}`;
  const overrides = OPEN_OVERRIDES[key] || [];
  const computed = getVoicings(root, quality);

  if (overrides.length === 0) {
    // No hand-crafted open voicings — keep all computed shapes
    return computed.filter(v => v.baseFret >= 1);
  }

  // Find the highest baseFret among overrides so we don't duplicate them
  const maxOverrideFret = Math.max(...overrides.map(v => v.baseFret));
  // Keep computed shapes that start strictly above the override range
  const barreComputed = computed.filter(v => v.baseFret > maxOverrideFret);
  return [...overrides, ...barreComputed];
}

// ─── FRETBOARD DIAGRAM ─────────────────────────────────────────────────────

function buildFretboardSVG(voicing, baseFret) {
  const STRINGS_COUNT = 6;
  const FRETS_SHOWN = 5;
  // Real guitar proportions: string spacing ~14mm, fret spacing ~18mm
  // Make diagram wider and shorter: W > H so frets are taller than string gaps are wide
  const W = 148, H = 130;
  const left = 34, top = 24, right = W - 14, bottom = H - 14;
  const strW = (right - left) / (STRINGS_COUNT - 1);   // ~20px between strings
  const fretH = (bottom - top) / FRETS_SHOWN;           // ~18px between frets

  let svg = `<svg class="diagram" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  // Nut
  if (baseFret === 1) {
    svg += `<line x1="${left}" y1="${top}" x2="${right}" y2="${top}" stroke="#c9a84c" stroke-width="3.5"/>`;
  } else {
    // Position number: right-aligned, comfortably left of the first string with room to spare
    svg += `<text x="${left - 8}" y="${top + fretH * 0.5 + 4}" fill="#a09070" font-size="12" font-weight="500" font-family="DM Mono, monospace" text-anchor="end">${baseFret}</text>`;
    svg += `<line x1="${left}" y1="${top}" x2="${right}" y2="${top}" stroke="#3a3228" stroke-width="1"/>`;
  }

  // Fret lines
  for (let f = 0; f <= FRETS_SHOWN; f++) {
    const y = top + f * fretH;
    svg += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#2e2820" stroke-width="1"/>`;
  }

  // String lines — varying thickness low E to high e
  const stringWeights = [1.8, 1.5, 1.2, 1.0, 0.85, 0.7];
  for (let s = 0; s < STRINGS_COUNT; s++) {
    const x = left + s * strW;
    svg += `<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="#4a4035" stroke-width="${stringWeights[s]}"/>`;
  }

  // Barre detection — a barre exists when the minimum fret spans 3+ strings
  // anchored on string 0 or 1, OR spans 4+ strings regardless, OR 4+ strings share it.
  // This correctly handles E-shape (strings 0-5) and A-shape (strings 1-5) barres
  // even when middle strings have additional fingers at higher frets.
  const frettedPairs = voicing.map((v, i) => ({ v, i })).filter(o => o.v !== null && o.v > 0);
  let barreFromStr = -1, barreToStr = -1, barreFret = -1;

  if (frettedPairs.length >= 2) {
    const minFret = Math.min(...frettedPairs.map(o => o.v));
    const atMin = frettedPairs.filter(o => o.v === minFret);
    if (atMin.length >= 1) {
      const loStr = Math.min(...atMin.map(o => o.i));
      const hiStr = Math.max(...atMin.map(o => o.i));
      const span  = hiStr - loStr;
      const lowAnchored = loStr <= 1; // index on low E or A string
      if (atMin.length >= 4 || span >= 4 || (span >= 3 && lowAnchored)) {
        barreFromStr = loStr;
        barreToStr   = hiStr;
        barreFret    = minFret;
      }
    }
  }

  // Dots & mutes — skip individual dots on strings covered by the barre
  const dotR = Math.min(strW * 0.38, fretH * 0.38);
  for (let s = 0; s < STRINGS_COUNT; s++) {
    const x    = left + s * strW;
    const fret = voicing[s];
    const onBarre = barreFret > 0 && fret === barreFret && s >= barreFromStr && s <= barreToStr;

    if (fret === null) {
      svg += `<text x="${x}" y="${top - 7}" fill="#8a3a2a" font-size="11" text-anchor="middle" font-family="DM Mono">×</text>`;
    } else if (fret === 0) {
      svg += `<circle cx="${x}" cy="${top - 8}" r="4.5" fill="none" stroke="#c9a84c" stroke-width="1.4"/>`;
    } else if (!onBarre) {
      // Only draw individual dot if this string is NOT part of the barre
      const relFret = fret - baseFret + 1;
      if (relFret >= 1 && relFret <= FRETS_SHOWN) {
        const cy = top + (relFret - 0.5) * fretH;
        svg += `<circle cx="${x}" cy="${cy}" r="${dotR}" fill="#c9a84c"/>`;
      }
    }
  }

  // Draw barre bar (fully opaque, drawn after dots so it's clearly on top)
  if (barreFret > 0) {
    const relFret = barreFret - baseFret + 1;
    if (relFret >= 1 && relFret <= FRETS_SHOWN) {
      const cy = top + (relFret - 0.5) * fretH;
      const x1 = left + barreFromStr * strW;
      const x2 = left + barreToStr   * strW;
      svg += `<rect x="${x1 - dotR}" y="${cy - dotR}" width="${x2 - x1 + dotR*2}" height="${dotR*2}" rx="${dotR}" fill="#c9a84c"/>`;
    }
  }

  svg += '</svg>';
  return svg;
}

function renderInversions() {

  const mobileSelect  = document.getElementById('rootSelectMobile');
  const desktopSelect = document.getElementById('rootSelectDesktop');
  if (mobileSelect  && mobileSelect.value  !== currentRoot) currentRoot = mobileSelect.value;
  if (desktopSelect && desktopSelect.value !== currentRoot) currentRoot = desktopSelect.value;

  const q = QUALITIES[currentQuality];
  document.getElementById('chordTitle').textContent    = `${currentRoot} ${q.name}`;
  document.getElementById('chordSubtitle').textContent = `All inversions & voicings across the fretboard`;

  const voicings = getVoicingsForChord(currentRoot, currentQuality);
  const grid = document.getElementById('chordGrid');
  grid.innerHTML = '';

  voicings.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = `chord-card${i === selectedCardIndex ? ' selected' : ''}`;
    card.innerHTML = `
      <div class="card-label">${currentRoot}${q.sym}</div>
      <div class="card-type">${v.label}</div>
      <div class="fretboard-wrap">
        <div class="fret-position">${v.baseFret <= 1 ? 'Open' : `Pos. ${v.baseFret}`}</div>
        ${buildFretboardSVG(v.voicing, v.baseFret)}

    card.onclick = () => {
      selectedCardIndex = i;
      showDetail(v, currentRoot, q);
      renderInversions();
      closeDrawer();

    grid.appendChild(card);
  });

  if (voicings[selectedCardIndex]) {
    showDetail(voicings[selectedCardIndex], currentRoot, q);

const CAT_TAG_CLASS = { dark:'tag-dark', folk:'tag-folk', modal:'tag-modal', classic:'tag-classic', ab:'tag-ab' };
const CAT_TAG_LABEL = { dark:'Dark', folk:'Folk', modal:'Modal', classic:'Classic', ab:'A/B Form' };

function buildProgList() {
  const visible = PROGRESSIONS.filter(p => currentCategory === 'all' || p.cat === currentCategory);

  const renderList = (containerId) => {
    const list = document.getElementById(containerId);
    if (!list) return;
    list.innerHTML = '';
    visible.forEach(p => {
      const item = document.createElement('div');
      item.className = `prog-item${p.id === currentProgId ? ' active' : ''}`;

        <div class="prog-chords">${p.genre}</div>
        <span class="prog-tag ${CAT_TAG_CLASS[p.cat]}">${CAT_TAG_LABEL[p.cat]}</span>`;
      item.onclick = () => {
        currentProgId = p.id;
        buildProgList();
        renderProgression();
        closeDrawer();
      };
      list.appendChild(item);
    });

  renderList('progListMobile');
  renderList('progListDesktop');

function renderProgression() {
  const keySelect = document.getElementById('progKeySelectDesktop');
  const key = keySelect ? keySelect.value : 'C';
  const prog = PROGRESSIONS.find(p => p.id === currentProgId);
  if (!prog) return;

  const keyIdx = NOTES.indexOf(key);
  document.getElementById('progTitle').textContent = prog.name;
  document.getElementById('progDesc').textContent  = `${prog.desc} — ${prog.feel}`;

  // Build chord list
  const chords = prog.steps.map((s, i) => {
    const noteIdx = (keyIdx + s) % 12;
    const q = prog.mixedQ ? prog.mixedQ[i] : (prog.minor ? 'minor' : (
      ['ii','vi','iii'].includes((prog.degrees||[])[i]) ? 'minor' : 'major'
    ));
    const sym = q === 'minor' ? 'm' : '';
    return {
      name: NOTES[noteIdx] + sym,
      root: NOTES[noteIdx],
      quality: q,
      degree: (prog.degrees||[])[i] || '',
      abLabel: prog.abLabel ? prog.abLabel[i] : null
    };
  });

  // Sequence display
  const seqWrap = document.getElementById('progSequenceWrap');
  let prevAB = null;
  seqWrap.innerHTML = `<div class="prog-sequence">` +
    chords.map((c, i) => {
      let abBadge = '';
      if (c.abLabel && c.abLabel !== prevAB) {
        abBadge = `<div style="font-size:0.75rem;letter-spacing:0.15em;color:var(--amber);margin-bottom:0.3rem">SECTION ${c.abLabel}</div>`;
        prevAB = c.abLabel;
      }
      return `<div class="prog-chord-card">
        ${abBadge}
        <div class="prog-degree">${c.degree}</div>
        <div class="prog-chord-name">${c.name}</div>
      </div>${i < chords.length - 1 ? '<div class="prog-arrow">→</div>' : ''}`;
    }).join('') +
    `</div>
    <div class="tips-box" style="max-width:100%;margin-bottom:1.5rem">
      <strong>About this progression:</strong> ${prog.desc}. Genre: <em>${prog.genre}</em>. Feel: <em>${prog.feel}</em>.<br>
      In the key of <strong>${key}</strong>: ${chords.map(c => c.name).join(' → ')}.
    </div>`;

  // Smart voicing selection for progressions:
  // 1. Gather ALL available voicings for every chord in the progression
  // 2. For "open" mode: prefer voicings with baseFret <= 4; pick lowest position
  // 3. For "upper" mode: find the median fret across all chords' best voicings,
  //    then for each chord pick the voicing whose baseFret is closest to that median,
  //    so the whole progression stays in a coherent fret zone.

  function getBestVoicingForMode(root, quality, mode, targetFret) {
    const all = getVoicingsForChord(root, quality);
    if (mode === 'open') {
      // "Open/low" means: open-string voicings first, then lowest barre position.
      // Include up to baseFret 5 so that common shapes like Em-shape at fret 4 are available.
      const low = all.filter(v => v.baseFret <= 5);
      if (low.length) {
        // Sort by baseFret ascending, prefer open (baseFret=1) first
        low.sort((a, b) => a.baseFret - b.baseFret);
        return low[0];
      }
      return all[0];
    } else {
      // Upper: pick the voicing whose baseFret is closest to targetFret,
      // but prefer positions >= 4 (not open strings) when possible.
      const upper = all.filter(v => v.baseFret >= 4);
      const pool = upper.length ? upper : all;
      return pool.reduce((best, v) =>
        Math.abs(v.baseFret - targetFret) < Math.abs(best.baseFret - targetFret) ? v : best
      , pool[0]);
    }
  }

  // For upper mode: compute target fret as median of each chord's lowest barre position
  let targetFret = 5;
  if (progPosition === 'upper') {
    const barrePositions = chords.map(c => {
      const all = getVoicingsForChord(c.root, c.quality);
      // Get the lowest barre position available (>= 4) for each chord
      const upper = all.filter(v => v.baseFret >= 4);
      upper.sort((a, b) => a.baseFret - b.baseFret);
      return upper.length ? upper[0].baseFret : 4;
    }).sort((a, b) => a - b);
    // Median — avoids one outlier chord dragging everyone to fret 11
    targetFret = barrePositions[Math.floor(barrePositions.length / 2)];
  }

  // Get voicings filtered by position preference
  const diagWrap = document.getElementById('progDiagramsWrap');
  diagWrap.innerHTML = `<div class="sidebar-label" style="margin-bottom:1rem">Chord Voicings — ${progPosition === 'open' ? 'Open / 1st Position' : `Upper Neck (around fret ${targetFret})`}</div><div class="prog-detail-grid">` +
    chords.map(c => {
      const v = getBestVoicingForMode(c.root, c.quality, progPosition, targetFret);
      if (!v) return `<div class="prog-chord-card"><div class="prog-chord-name">${c.name}</div></div>`;
      return `<div class="chord-card">
          <div class="card-label">${c.name}</div>
          <div class="card-type">${c.degree} — ${v.label}</div>
          <div class="fretboard-wrap">
            <div class="fret-position">${v.baseFret <= 1 ? 'Open' : `Pos. ${v.baseFret}`}</div>
            ${buildFretboardSVG(v.voicing, v.baseFret)}
          </div>
        </div>`;
    }).join('') + '</div>';
}

// ─── DRAWER ────────────────────────────────────────────────────────────────

function toggleDrawer() {
  const drawer = document.getElementById('drawer');
  const scrim  = document.getElementById('drawer-scrim');
  if (drawer.classList.contains('open')) {
    closeDrawer();
  } else {
    drawer.classList.add('open');
    scrim.classList.add('visible');
    // Shrink main content area to avoid content hiding behind open drawer
    const drawerEl = document.getElementById('drawer');
    const drawerH = drawerEl.offsetHeight;
    document.getElementById('app-main').style.bottom = drawerH + 'px';
  }
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-scrim').classList.remove('visible');
  document.getElementById('app-main').style.bottom = 'var(--drawer-height)';
}

// Build the key grid buttons for inversions drawer
function buildKeyGrid(containerId, onClickFn, activeKey) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = NOTES.map(n =>
    `<button class="key-btn${n === activeKey ? ' active' : ''}" onclick="${onClickFn}('${n}')">${n}</button>`
  ).join('');
}

// Sync root note across all selects + key grids
function syncRoot(val) {
  currentRoot = val;
  ['rootSelectMobile','rootSelectDesktop'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = val;
  });
  buildKeyGrid('mobileKeyGrid', 'syncRoot', val);
  selectedCardIndex = 0;
  renderInversions();
  updateDrawerHandle();
}

// Sync prog key across all selects + key grids
function syncProgKey(val) {
  ['progKeySelectDesktop'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = val;
  });
  buildKeyGrid('mobileProgKeyGrid', 'syncProgKey', val);
  renderProgression();
  updateDrawerHandle();
}

function updateDrawerHandle() {
  const label = document.getElementById('drawerCurrentLabel');
  if (!label) return;
  if (currentMode === 'inversions') {
    const q = QUALITIES[currentQuality];
    label.textContent = `${currentRoot} ${q.name}`;
  } else {
    const prog = PROGRESSIONS.find(p => p.id === currentProgId);
    label.textContent = prog ? prog.name : '—';
  }
}

// ─── MODE SWITCH ───────────────────────────────────────────────────────────

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && mode === 'inversions') || (i === 1 && mode === 'progressions'));
  });

  // Views
  document.getElementById('inversionView').classList.toggle('hidden', mode !== 'inversions');
  document.getElementById('progressionView').classList.toggle('visible', mode === 'progressions');

  // Desktop sidebar panels
  const dInv  = document.getElementById('desktop-inv-sidebar');
  const dProg = document.getElementById('desktop-prog-sidebar');
  if (dInv)  dInv.style.display  = mode === 'inversions'   ? 'block' : 'none';
  if (dProg) dProg.style.display = mode === 'progressions' ? 'block' : 'none';

  // Mobile controls strip visibility
  const mobileStrip = document.getElementById('mobileInvControls');
  if (mobileStrip) mobileStrip.style.display = mode === 'inversions' ? 'flex' : 'none';

  // Drawer mode
  const drawer = document.getElementById('drawer');
  if (drawer) {
    drawer.classList.toggle('inv-mode', false); // remove first
    // Show drawer for progressions; for inversions also show (with different content)
    drawer.classList.remove('inv-mode');

    const invBody  = document.getElementById('inv-drawer-body');
    const progBody = document.getElementById('prog-drawer-body');
    if (invBody)  invBody.style.display  = mode === 'inversions'   ? 'block' : 'none';
    if (progBody) progBody.style.display = mode === 'progressions' ? 'block' : 'none';
  }

  if (mode === 'progressions') {
    renderProgression();
    buildProgList();
  }

  closeDrawer();
  updateDrawerHandle();
}

// ─── INIT ──────────────────────────────────────────────────────────────────

// Build mobile key grids
buildKeyGrid('mobileKeyGrid',     'syncRoot',    currentRoot);
buildKeyGrid('mobileProgKeyGrid', 'syncProgKey', 'C');

// Hide mobile controls strip on desktop via CSS; show for inversions by default
const mobileStrip = document.getElementById('mobileInvControls');
if (mobileStrip) mobileStrip.style.display = 'flex';

// Init drawer state
const drawer = document.getElementById('drawer');
if (drawer) {
  document.getElementById('inv-drawer-body').style.display  = 'block';
  document.getElementById('prog-drawer-body').style.display = 'none';
  // Hide mobile controls strip — drawer handles it on mobile
  // but keep it for progressive enhancement
}

buildProgList();
renderInversions();
updateDrawerHandle();
</script>
