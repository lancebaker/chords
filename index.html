<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fretboard — Chord Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0c0a;
    --surface: #1a1712;
    --surface2: #231f1a;
    --border: #3a3228;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --amber: #d97706;
    --cream: #f5eedc;
    --muted: #8a7e6e;
    --string: #4a4035;
    --fret: #2e2820;
    --nut: #c9a84c;
    --dot-fill: #c9a84c;
    --dot-stroke: #8a6820;
    --open-dot: transparent;
    --mute: #8a3a2a;
  }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  header {
    padding: 2.5rem 3rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: -0.02em;
  }

  .logo span {
    color: var(--cream);
    font-weight: 400;
    font-style: italic;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .container {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 90px);
  }

  /* Sidebar */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 2rem 1.5rem;
    background: var(--surface);
  }

  .sidebar-section {
    margin-bottom: 2rem;
  }

  .sidebar-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
  }

  .mode-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
  }

  .mode-tab {
    flex: 1;
    padding: 0.6rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-tab.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--bg);
  }

  select, .pill-group {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 0.6rem 0.75rem;
    cursor: pointer;
    appearance: none;
    outline: none;
    margin-bottom: 0.5rem;
  }

  select:focus { border-color: var(--gold); }

  .pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 0.5rem;
  }

  .pill {
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
  }

  .pill:hover { border-color: var(--gold); color: var(--gold); }
  .pill.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }

  .progression-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .prog-item {
    padding: 0.7rem 0.75rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
  }

  .prog-item:hover { border-color: var(--gold); }
  .prog-item.active { border-color: var(--gold); background: rgba(201,168,76,0.08); }

  .prog-name {
    font-size: 0.7rem;
    color: var(--gold-light);
    margin-bottom: 0.2rem;
  }

  .prog-chords {
    font-size: 0.65rem;
    color: var(--muted);
    font-style: italic;
    font-family: 'Crimson Pro', serif;
  }

  /* Main content */
  .main {
    padding: 2.5rem 3rem;
  }

  .chord-header {
    margin-bottom: 2rem;
  }

  .chord-title {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    font-weight: 900;
    color: var(--cream);
    line-height: 1;
  }

  .chord-subtitle {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  .chord-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }

  .chord-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.2rem;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .chord-card::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--gold);
    transform: scaleX(0);
    transition: transform 0.25s;
  }

  .chord-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .chord-card:hover::before { transform: scaleX(1); }
  .chord-card.selected { border-color: var(--gold); background: rgba(201,168,76,0.06); }
  .chord-card.selected::before { transform: scaleX(1); }

  .card-label {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--gold-light);
    margin-bottom: 0.25rem;
  }

  .card-type {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* Fretboard Diagram */
  .fretboard-wrap {
    margin-top: 0.5rem;
  }

  .fret-position {
    font-size: 0.6rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    letter-spacing: 0.05em;
  }

  svg.diagram { display: block; }

  /* Detail Panel */
  .detail-panel {
    margin-top: 3rem;
    border-top: 1px solid var(--border);
    padding-top: 2rem;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .detail-meta {
    display: flex;
    gap: 2rem;
    margin: 1rem 0 2rem;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .meta-label {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .meta-value {
    font-family: 'Crimson Pro', serif;
    font-size: 1rem;
    color: var(--cream);
  }

  .tips-box {
    background: var(--surface);
    border-left: 3px solid var(--gold);
    padding: 1rem 1.25rem;
    font-family: 'Crimson Pro', serif;
    font-size: 0.95rem;
    color: var(--cream);
    line-height: 1.7;
    max-width: 600px;
  }

  .tips-box strong {
    color: var(--gold-light);
    font-weight: 600;
  }

  /* Progression view */
  .progression-view {
    display: none;
  }

  .progression-view.visible {
    display: block;
  }

  .inversion-view {
    display: block;
  }

  .inversion-view.hidden {
    display: none;
  }

  .prog-sequence {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    margin: 2rem 0;
  }

  .prog-chord-card {
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1rem;
    min-width: 140px;
    transition: all 0.2s;
  }

  .prog-chord-card.active-step {
    border-color: var(--gold);
    background: rgba(201,168,76,0.08);
  }

  .prog-arrow {
    color: var(--muted);
    font-size: 1.5rem;
  }

  .prog-chord-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold-light);
    margin-bottom: 0.2rem;
  }

  .prog-degree {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 1rem;
  }

  .play-btn:hover {
    background: var(--gold);
    color: var(--bg);
  }

  .prog-key-selector {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .prog-key-selector label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .step-indicator {
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  .prog-detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1.5rem;
    margin-top: 2rem;
  }

  .cat-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-bottom: 0.75rem;
  }

  .cat-pill {
    padding: 0.2rem 0.55rem;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
  }

  .cat-pill:hover { border-color: var(--gold); color: var(--gold); }
  .cat-pill.active { background: rgba(201,168,76,0.15); border-color: var(--gold); color: var(--gold-light); }

  .prog-item .prog-tag {
    font-size: 0.55rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.1rem 0.4rem;
    border: 1px solid;
    margin-top: 0.35rem;
    display: inline-block;
  }

  .tag-dark { color: #9b6f8a; border-color: #9b6f8a; }
  .tag-folk { color: #7a9b6f; border-color: #7a9b6f; }
  .tag-modal { color: #6f8a9b; border-color: #6f8a9b; }
  .tag-classic { color: var(--muted); border-color: var(--border); }
  .tag-ab { color: #9b8a6f; border-color: #9b8a6f; }

  .pos-btn {
    padding: 0.4rem 0.9rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pos-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--bg);
  }

  /* Roman numeral badge */
  .numeral {
    display: inline-block;
    font-family: 'Crimson Pro', serif;
    font-size: 0.75rem;
    color: var(--amber);
    border: 1px solid var(--amber);
    padding: 0.1rem 0.35rem;
    margin-left: 0.4rem;
    vertical-align: middle;
  }

</style>
</head>
<body>

<header>
  <div class="logo">Fret<span>board</span></div>
  <div class="tagline">Chord Inversions & Progressions Explorer</div>
</header>

<div class="container">
  <aside class="sidebar">
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="setMode('inversions')">Inversions</button>
      <button class="mode-tab" onclick="setMode('progressions')">Progressions</button>
    </div>

    <!-- Inversions sidebar -->
    <div id="inv-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Root Note</div>
        <select id="rootSelect" onchange="renderInversions()">
          <option>C</option><option>C#</option><option>D</option><option>D#</option>
          <option>E</option><option>F</option><option>F#</option><option>G</option>
          <option>G#</option><option>A</option><option>A#</option><option>B</option>
        </select>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Chord Quality</div>
        <div class="pill-group">
          <button class="pill active" onclick="setQuality(this,'major')">Major</button>
          <button class="pill" onclick="setQuality(this,'minor')">Minor</button>
          <button class="pill" onclick="setQuality(this,'dom7')">Dom 7</button>
          <button class="pill" onclick="setQuality(this,'maj7')">Maj 7</button>
          <button class="pill" onclick="setQuality(this,'min7')">Min 7</button>
          <button class="pill" onclick="setQuality(this,'dim')">Dim</button>
          <button class="pill" onclick="setQuality(this,'aug')">Aug</button>
          <button class="pill" onclick="setQuality(this,'sus2')">Sus2</button>
          <button class="pill" onclick="setQuality(this,'sus4')">Sus4</button>
          <button class="pill" onclick="setQuality(this,'add9')">Add9</button>
        </div>
      </div>
    </div>

    <!-- Progressions sidebar -->
    <div id="prog-sidebar" style="display:none">
      <div class="sidebar-section">
        <div class="sidebar-label">Key</div>
        <select id="progKeySelect" onchange="renderProgression()">
          <option>C</option><option>C#</option><option>D</option><option>D#</option>
          <option>E</option><option>F</option><option>F#</option><option>G</option>
          <option>G#</option><option>A</option><option>A#</option><option>B</option>
        </select>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Filter</div>
        <div class="cat-filter">
          <button class="cat-pill active" onclick="setCategory(this,'all')">All</button>
          <button class="cat-pill" onclick="setCategory(this,'dark')">Dark</button>
          <button class="cat-pill" onclick="setCategory(this,'modal')">Modal</button>
          <button class="cat-pill" onclick="setCategory(this,'folk')">Folk</button>
          <button class="cat-pill" onclick="setCategory(this,'ab')">A/B Form</button>
          <button class="cat-pill" onclick="setCategory(this,'classic')">Classic</button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Progressions</div>
        <div class="progression-list" id="progList"></div>
      </div>
    </div>
  </aside>

  <main class="main">

    <!-- Inversions View -->
    <div class="inversion-view" id="inversionView">
      <div class="chord-header">
        <div class="chord-title" id="chordTitle">C Major</div>
        <div class="chord-subtitle" id="chordSubtitle">All inversions & voicings across the fretboard</div>
      </div>
      <div class="chord-grid" id="chordGrid"></div>
      <div id="detailPanel"></div>
    </div>

    <!-- Progressions View -->
    <div class="progression-view" id="progressionView">
      <div class="chord-header">
        <div class="chord-title" id="progTitle">i–♭VII–♭VI–♭VII</div>
        <div class="chord-subtitle" id="progDesc"></div>
      </div>
      <div id="progSequenceWrap"></div>
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
        <span style="font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted)">Voicing Position</span>
        <div style="display:flex;gap:0.4rem;">
          <button class="pos-btn active" id="posOpenBtn" onclick="setProgPosition('open',this)">Open / 1st</button>
          <button class="pos-btn" id="posUpperBtn" onclick="setProgPosition('upper',this)">Upper Neck</button>
        </div>
      </div>
      <div id="progDiagramsWrap"></div>
    </div>

  </main>
</div>

<script>
// ─── DATA ──────────────────────────────────────────────────────────────────

const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const STRINGS = [4,9,2,7,11,4]; // E A D G B e (semitones from C)

// Chord intervals
const QUALITIES = {
  major:  { name:'Major',   sym:'',    intervals:[0,4,7] },
  minor:  { name:'Minor',   sym:'m',   intervals:[0,3,7] },
  dom7:   { name:'Dom 7',   sym:'7',   intervals:[0,4,7,10] },
  maj7:   { name:'Maj 7',   sym:'maj7',intervals:[0,4,7,11] },
  min7:   { name:'Min 7',   sym:'m7',  intervals:[0,3,7,10] },
  dim:    { name:'Dim',     sym:'°',   intervals:[0,3,6] },
  aug:    { name:'Aug',     sym:'+',   intervals:[0,4,8] },
  sus2:   { name:'Sus2',    sym:'sus2',intervals:[0,2,7] },
  sus4:   { name:'Sus4',    sym:'sus4',intervals:[0,5,7] },
  add9:   { name:'Add9',    sym:'add9',intervals:[0,4,7,14] },
};

// ─── TRANSPOSABLE SHAPE ENGINE ─────────────────────────────────────────────
// Each shape is defined relative to a "base fret" offset from the root note's
// position on a specific string. We store the open-position template and
// compute actual fret numbers at runtime for any root.
//
// String tuning in semitones from C: E2=4, A2=9, D3=2, G3=7, B3=11, e4=4
// String indices: 0=low E, 1=A, 2=D, 3=G, 4=B, 5=high e
const STRING_TUNING = [4, 9, 2, 7, 11, 4]; // semitones from C, per string

// For a given root note and string, find the lowest fret >= minFret that plays that note
function fretForNote(noteIdx, stringIdx, minFret = 0) {
  const open = STRING_TUNING[stringIdx]; // pitch of open string (mod 12)
  let fret = ((noteIdx - open) % 12 + 12) % 12;
  while (fret < minFret) fret += 12;
  return fret;
}

// Shape templates: offsets relative to root fret on a given anchor string.
// null = muted. Each shape specifies which string carries the root.
// offsets: array of [relFret|null] per string [E,A,D,G,B,e]
// anchorString: which string index the root sits on
// minFret: minimum fret to place (so open shapes stay near nut)

const SHAPE_TEMPLATES = {
  major: [
    // E-shape: root on low E string (string 0)
    { label:'E-shape (root pos)', anchor:0, offsets:[0,2,2,1,0,0], fingers:'E-shape barre', tips:'Full 6-string E-shape. Barre across all strings at the root fret.' },
    // A-shape: root on A string (string 1)
    { label:'A-shape (root pos)', anchor:1, offsets:[null,0,2,2,2,0], fingers:'A-shape barre', tips:'A-shape barre. Mute or skip low E. Warm, full sound.' },
    // D-shape: root on D string (string 2) — compact, 4-string
    { label:'D-shape (root pos)', anchor:2, offsets:[null,null,0,2,3,2], fingers:'D-shape', tips:'Open D-style shape transposed. Works well for fingerpicking.' },
    // A-shape upper position
    { label:'A-shape (upper pos)', anchor:1, offsets:[null,0,2,2,2,0], fingers:'A-shape barre (upper)', minFret:5, tips:'Same A-shape barre higher up the neck. Brighter, more compressed tone.' },
    // E-shape upper
    { label:'E-shape (upper pos)', anchor:0, offsets:[0,2,2,1,0,0], fingers:'E-shape barre (upper)', minFret:7, tips:'E-shape barre in upper position. Focused and articulate.' },
  ],
  minor: [
    // Em-shape: root on low E string
    { label:'E-shape (root pos)', anchor:0, offsets:[0,2,2,0,0,0], fingers:'Em-shape barre', tips:'Full Em-shape barre. Dark and resonant across all 6 strings.' },
    // Am-shape: root on A string
    { label:'A-shape (root pos)', anchor:1, offsets:[null,0,2,2,1,0], fingers:'Am-shape barre', tips:'Am-shape barre. The most common minor barre chord shape.' },
    // Dm-shape: root on D string — compact
    { label:'D-shape (root pos)', anchor:2, offsets:[null,null,0,2,3,1], fingers:'Dm-shape', tips:'Dm-style shape. Works well fingerpicked on strings 4–1.' },
    // Am upper position
    { label:'A-shape (upper pos)', anchor:1, offsets:[null,0,2,2,1,0], fingers:'Am-shape barre (upper)', minFret:5, tips:'Am-shape barre moved up the neck. Warmer mid-register tone.' },
    // Em upper position
    { label:'E-shape (upper pos)', anchor:0, offsets:[0,2,2,0,0,0], fingers:'Em-shape barre (upper)', minFret:7, tips:'Em-shape higher on neck. Dense, rich minor voicing.' },
  ],
  dom7: [
    { label:'E7-shape (root pos)', anchor:0, offsets:[0,2,0,1,0,0], fingers:'E7-shape', tips:'E7-shape barre. The classic dominant 7th sound — bluesy and tense.' },

// Compute actual voicings from a shape template for a given root note
function computeVoicing(shape, rootNote) {
  const rootIdx = NOTES.indexOf(rootNote);
  const anchorStr = shape.anchor;
  // Find root fret on anchor string
  const minFret = shape.minFret || 0;
  const rootFret = fretForNote(rootIdx, anchorStr, minFret);
  
  // Compute each string's fret
  const voicing = shape.offsets.map((offset, strIdx) => {
    if (offset === null) return null;
    const fret = rootFret + offset;
    // If fret 0 is specifically wanted (open string) check it matches
    // For non-anchor open strings in templates, keep as-is offset from root
    return fret;
  });

  // baseFret: the lowest non-zero fret played, for diagram positioning
  const frettedFrets = voicing.filter(f => f !== null && f > 0);
  const minPlayed = frettedFrets.length ? Math.min(...frettedFrets) : 1;
  const baseFret = minPlayed <= 1 ? 1 : minPlayed;

  // Build fingering string
  const fingerStr = voicing.map(f => f === null ? 'x' : f === 0 ? '0' : f).join('-');

  return {
    label: shape.label,
    voicing,
    baseFret,
    fingers: fingerStr,
    tips: shape.tips,
  };
}

// Get all voicings for a root + quality
function getVoicings(rootNote, quality) {
  const shapes = SHAPE_TEMPLATES[quality] || SHAPE_TEMPLATES['major'];
  return shapes.map(shape => computeVoicing(shape, rootNote));
}

  const key = `${root}-${quality}`;
  const overrides = OPEN_OVERRIDES[key] || [];
  const computed = getVoicings(root, quality);
  // Deduplicate: if override covers same label pattern, prefer override
  // Return overrides first (open positions), then computed upper positions
  const upperComputed = computed.filter(v => v.baseFret >= 5);
  return [...overrides, ...upperComputed];
}

// ─── FRETBOARD DIAGRAM ─────────────────────────────────────────────────────

function buildFretboardSVG(voicing, baseFret) {
  const STRINGS_COUNT = 6;
  const FRETS_SHOWN = 5;
  const W = 120, H = 120;
  const left = 22, top = 22, right = W - 14, bottom = H - 16;
  const strW = (right - left) / (STRINGS_COUNT - 1);
  const fretH = (bottom - top) / FRETS_SHOWN;
  const endFret = baseFret + FRETS_SHOWN - 1;

  let svg = `<svg class="diagram" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  // Nut
  if (baseFret === 1) {
    svg += `<line x1="${left}" y1="${top}" x2="${right}" y2="${top}" stroke="#c9a84c" stroke-width="3"/>`;
  } else {
    svg += `<text x="${left - 4}" y="${top + fretH * 0.5 + 4}" fill="#8a7e6e" font-size="8" font-family="DM Mono, monospace" text-anchor="end">${baseFret}</text>`;
    svg += `<line x1="${left}" y1="${top}" x2="${right}" y2="${top}" stroke="#3a3228" stroke-width="1"/>`;
  }

  // Fret lines
  for (let f = 0; f <= FRETS_SHOWN; f++) {
    const y = top + f * fretH;
    svg += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#2e2820" stroke-width="1"/>`;
  }

  // String lines
  for (let s = 0; s < STRINGS_COUNT; s++) {
    const x = left + s * strW;
    svg += `<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="#4a4035" stroke-width="${0.8 + (STRINGS_COUNT - 1 - s) * 0.2}"/>`;
  }

  // Dots & mutes
  for (let s = 0; s < STRINGS_COUNT; s++) {
    const x = left + s * strW;
    const fret = voicing[s];

    if (fret === null) {
      // Muted
      svg += `<text x="${x}" y="${top - 6}" fill="#8a3a2a" font-size="9" text-anchor="middle" font-family="DM Mono">×</text>`;
    } else if (fret === 0) {
      // Open
      svg += `<circle cx="${x}" cy="${top - 7}" r="4" fill="none" stroke="#c9a84c" stroke-width="1.2"/>`;
    } else {
      // Fretted
      const relFret = fret - baseFret + 1;
      if (relFret >= 1 && relFret <= FRETS_SHOWN) {
        const cy = top + (relFret - 0.5) * fretH;
        svg += `<circle cx="${x}" cy="${cy}" r="7" fill="#c9a84c"/>`;
      }
    }
  }

  // Barre detection
  const frettedNotes = voicing.filter(v => v !== null && v !== 0);
  if (frettedNotes.length >= 4) {
    const minFret = Math.min(...frettedNotes);
    const barreStrings = voicing.map((v, i) => ({ v, i })).filter(o => o.v === minFret);
    if (barreStrings.length >= 4) {
      const relFret = minFret - baseFret + 1;
      const cy = top + (relFret - 0.5) * fretH;
      const x1 = left + barreStrings[0].i * strW;
      const x2 = left + barreStrings[barreStrings.length - 1].i * strW;
      svg += `<rect x="${x1 - 6}" y="${cy - 7}" width="${x2 - x1 + 12}" height="14" rx="7" fill="#c9a84c" opacity="0.85"/>`;
    }
  }

  svg += '</svg>';
  return svg;
}

// ─── INVERSIONS ────────────────────────────────────────────────────────────

function setQuality(btn, q) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  currentQuality = q;
  selectedCardIndex = 0;
  renderInversions();
}

function renderInversions() {
  currentRoot = document.getElementById('rootSelect').value;
  const q = QUALITIES[currentQuality];
  document.getElementById('chordTitle').textContent = `${currentRoot} ${q.name}`;
  document.getElementById('chordSubtitle').textContent = `All inversions & voicings across the fretboard`;

  const voicings = getVoicingsForChord(currentRoot, currentQuality);

  const grid = document.getElementById('chordGrid');
  grid.innerHTML = '';

  voicings.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = `chord-card${i === selectedCardIndex ? ' selected' : ''}`;
    card.innerHTML = `
      <div class="card-label">${currentRoot}${q.sym}</div>
      <div class="card-type">${v.label}</div>
      <div class="fretboard-wrap">
        <div class="fret-position">${v.baseFret <= 1 ? 'Open' : `Pos. ${v.baseFret}`}</div>
        ${buildFretboardSVG(v.voicing, v.baseFret)}
      </div>
    `;
    card.onclick = () => { selectedCardIndex = i; showDetail(v, currentRoot, q); renderInversions(); };
    grid.appendChild(card);
  });

  if (voicings[selectedCardIndex]) {
    showDetail(voicings[selectedCardIndex], currentRoot, q);
  }
}

function showDetail(v, root, q) {
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="detail-panel">
      <div class="detail-title">${root}${q.sym} — ${v.label}</div>
      <div class="detail-meta">
        <div class="meta-item">
          <span class="meta-label">Fingering</span>
          <span class="meta-value">${v.fingers}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Position</span>
          <span class="meta-value">${v.baseFret === 1 ? 'Open / 1st' : `Fret ${v.baseFret}`}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Chord Tones</span>
          <span class="meta-value">${q.intervals.map(i => NOTES[(NOTES.indexOf(root)+i)%12]).join(' – ')}</span>
        </div>
      </div>
      <div class="tips-box">
        <strong>Playing Tip:</strong> ${v.tips}
      </div>
    </div>
  `;
}

// ─── PROGRESSIONS ──────────────────────────────────────────────────────────

function setProgPosition(pos, btn) {
  progPosition = pos;
  document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProgression();
}

function setCategory(btn, cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const visible = PROGRESSIONS.filter(p => cat === 'all' || p.cat === cat);
  if (visible.length && !visible.find(p => p.id === currentProgId)) {
    currentProgId = visible[0].id;
  }
  buildProgList();
  renderProgression();
}

const CAT_TAG_CLASS = { dark:'tag-dark', folk:'tag-folk', modal:'tag-modal', classic:'tag-classic', ab:'tag-ab' };
const CAT_TAG_LABEL = { dark:'Dark', folk:'Folk', modal:'Modal', classic:'Classic', ab:'A/B Form' };

function buildProgList() {
  const list = document.getElementById('progList');
  list.innerHTML = '';
  const visible = PROGRESSIONS.filter(p => currentCategory === 'all' || p.cat === currentCategory);
  visible.forEach(p => {
    const item = document.createElement('div');
    item.className = `prog-item${p.id === currentProgId ? ' active' : ''}`;
    item.innerHTML = `<div class="prog-name">${p.name}</div>
      <div class="prog-chords">${p.genre}</div>
      <span class="prog-tag ${CAT_TAG_CLASS[p.cat]}">${CAT_TAG_LABEL[p.cat]}</span>`;
    item.onclick = () => { currentProgId = p.id; buildProgList(); renderProgression(); };
    list.appendChild(item);
  });
}

function renderProgression() {
  const key = document.getElementById('progKeySelect').value;
  const prog = PROGRESSIONS.find(p => p.id === currentProgId);
  if (!prog) return;

  const keyIdx = NOTES.indexOf(key);
  document.getElementById('progTitle').textContent = prog.name;
  document.getElementById('progDesc').textContent = `${prog.desc} — ${prog.feel}`;

  // Build chord list
  const chords = prog.steps.map((s, i) => {
    const noteIdx = (keyIdx + s) % 12;
    const q = prog.mixedQ ? prog.mixedQ[i] : (prog.minor ? 'minor' : (
      ['ii','vi','iii'].includes((prog.degrees||[])[i]) ? 'minor' : 'major'
    ));
    const sym = q === 'minor' ? 'm' : '';
    return {
      name: NOTES[noteIdx] + sym,
      root: NOTES[noteIdx],
      quality: q,
      degree: (prog.degrees||[])[i] || '',
      abLabel: prog.abLabel ? prog.abLabel[i] : null
    };
  });

  // Sequence display
  const seqWrap = document.getElementById('progSequenceWrap');
  let prevAB = null;
  seqWrap.innerHTML = `<div class="prog-sequence">` +
    chords.map((c, i) => {
      let abBadge = '';
      if (c.abLabel && c.abLabel !== prevAB) {
        abBadge = `<div style="font-size:0.6rem;letter-spacing:0.15em;color:var(--amber);margin-bottom:0.3rem">SECTION ${c.abLabel}</div>`;
        prevAB = c.abLabel;
      }
      return `<div class="prog-chord-card">
        ${abBadge}
        <div class="prog-degree">${c.degree}</div>
        <div class="prog-chord-name">${c.name}</div>
      </div>${i < chords.length - 1 ? '<div class="prog-arrow">→</div>' : ''}`;
    }).join('') +
    `</div>
    <div class="tips-box" style="max-width:100%;margin-bottom:1.5rem">
      <strong>About this progression:</strong> ${prog.desc}. Genre: <em>${prog.genre}</em>. Feel: <em>${prog.feel}</em>.<br>
      In the key of <strong>${key}</strong>: ${chords.map(c => c.name).join(' → ')}.
    </div>`;

  // Get voicings filtered by position preference
  const diagWrap = document.getElementById('progDiagramsWrap');
  diagWrap.innerHTML = `<div class="sidebar-label" style="margin-bottom:1rem">Chord Voicings — ${progPosition === 'open' ? 'Open / 1st Position' : 'Upper Neck Position'}</div><div class="prog-detail-grid">` +
    chords.map(c => {
      const allVoicings = getVoicingsForChord(c.root, c.quality);
      // Filter by position toggle
      let v;
      if (progPosition === 'open') {
        v = allVoicings.find(x => x.baseFret <= 3) || allVoicings[0];
      } else {
        v = allVoicings.find(x => x.baseFret >= 4) || allVoicings[allVoicings.length - 1];
      }
      if (!v) return `<div class="prog-chord-card"><div class="prog-chord-name">${c.name}</div></div>`;
      return `<div class="chord-card">
          <div class="card-label">${c.name}</div>
          <div class="card-type">${c.degree} — ${v.label}</div>
          <div class="fretboard-wrap">
            <div class="fret-position">${v.baseFret <= 1 ? 'Open' : `Pos. ${v.baseFret}`}</div>
            ${buildFretboardSVG(v.voicing, v.baseFret)}
          </div>
        </div>`;
    }).join('') + '</div>';
}

// ─── MODE SWITCH ───────────────────────────────────────────────────────────

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && mode === 'inversions') || (i === 1 && mode === 'progressions'));
  });
  document.getElementById('inversionView').classList.toggle('hidden', mode !== 'inversions');
  document.getElementById('progressionView').classList.toggle('visible', mode === 'progressions');
  document.getElementById('inv-sidebar').style.display = mode === 'inversions' ? 'block' : 'none';
  document.getElementById('prog-sidebar').style.display = mode === 'progressions' ? 'block' : 'none';
  if (mode === 'progressions') renderProgression();
}

// ─── INIT ──────────────────────────────────────────────────────────────────

buildProgList();
renderInversions();
</script>
</body>
</html>
